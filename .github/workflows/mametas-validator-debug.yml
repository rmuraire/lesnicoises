name: Mametas validator debug

on:
  push:
    branches:
      - mametas-coherence-content-polish-2026-10-02

permissions:
  contents: write

jobs:
  debug-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/v6_preserve_sources_dates_credits_2026_10_02.py
      - run: python scripts/v6_coherence_envelope_2026_10_02.py
      - run: python scripts/v3_destination_reality_layer_2026_09_25.py
      - run: python scripts/v6_city_card_system_2026_10_02.py
      - run: python scripts/v6_hotel_detail_normalization_2026_10_02.py
      - run: python scripts/v6_semantic_cleanup_2026_10_02.py
      - run: python scripts/v6_detail_family_top_normalization_2026_10_02.py
      - run: python scripts/v6_content_family_normalization_2026_10_02.py
      - run: python scripts/v6_plan_family_normalization_2026_10_02.py
      - name: Capture validator output
        shell: bash
        run: |
          if [ -f debug-validation.txt ]; then exit 0; fi
          set +e
          python scripts/validate_v6_content_coherence_2026_10_02.py > /tmp/validation.txt 2>&1
          code=$?
          cat /tmp/validation.txt
          if [ "$code" -ne 0 ]; then
            cp /tmp/validation.txt debug-validation.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug-validation.txt
            git commit -m "DEBUG OUTPUT validator"
            git push
          fi
          exit $code
