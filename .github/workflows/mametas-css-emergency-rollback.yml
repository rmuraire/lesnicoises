name: Mametas CSS emergency rollback

on:
  push:
    branches:
      - mametas-v3
    paths:
      - ".github/workflows/mametas-css-emergency-rollback.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: mametas-css-emergency-rollback
  cancel-in-progress: true

jobs:
  rollback-css:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko

      - name: Download last known-good production snapshot
        uses: actions/download-artifact@v4
        with:
          name: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27
          path: /tmp/mametas-good-css
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: rmuraire/lesnicoises
          run-id: 36914504302

      - name: Restore known-good CSS
        run: |
          test -s /tmp/mametas-good-css/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip
          rm -rf /tmp/mametas-good-site
          mkdir -p /tmp/mametas-good-site
          unzip -oq /tmp/mametas-good-css/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip -d /tmp/mametas-good-site
          test -s /tmp/mametas-good-site/assets/site.css
          test -s /tmp/mametas-good-site/assets/v3.css
          cp /tmp/mametas-good-site/assets/site.css assets/site.css
          cp /tmp/mametas-good-site/assets/v3.css assets/v3.css

      - name: Deploy rollback CSS to OVH
        env:
          MAMETAS_FORCE_FILES: assets/site.css;assets/v3.css
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Verify known-good CSS live
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import time

          checks={
            "https://www.mametas.com/assets/site.css?emergency-rollback=1":[
              ".destination-grid",".mini-rule",".fact-grid",".mobile-nav"
            ],
            "https://www.mametas.com/assets/v3.css?emergency-rollback=1":[
              ".decision-grid",".article-layout",".day-card",".v3-section"
            ],
          }
          for url,tokens in checks.items():
              last=None
              for _ in range(6):
                  try:
                      req=Request(url,headers={"User-Agent":"MametasCSSRollback/1.0","Cache-Control":"no-cache","Pragma":"no-cache"})
                      with urlopen(req,timeout=30) as r:
                          css=r.read().decode("utf-8","replace")
                      missing=[t for t in tokens if t not in css]
                      if not missing:
                          print("CSS restored live:",url)
                          break
                      last=f"missing {missing}"
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(3)
              else:
                  raise SystemExit(f"{url}: {last}")
          print("Mametas emergency CSS rollback passed")
          PY
