name: Mametas Commons source QA
on:
  push:
    branches:
      - mametas-recipe-culture-practical-stats-2026-10-10
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify licensed Wikimedia photo can be downloaded and decoded
        run: |
          pip -q install pillow
          python - <<'PY'
          from urllib.request import Request,urlopen
          from PIL import Image
          import io
          urls=(
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/08_Fondation_Maeght.JPG?width=1200',
              'https://commons.wikimedia.org/wiki/Special:FilePath/08%20Fondation%20Maeght.JPG?width=1200',
              'https://commons.wikimedia.org/w/api.php?action=query&titles=File%3A08_Fondation_Maeght.JPG&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json'
          )
          for url in urls:
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Mametas/1.0 (editorial-image; hello@mametas.com)','Accept':'image/jpeg,application/json'}),timeout=16) as response:
                      data=response.read(3500000)
                      print('REQUEST OK',response.status,len(data),response.url,flush=True)
                  try:
                      with Image.open(io.BytesIO(data)) as im:
                          im.verify()
                      with Image.open(io.BytesIO(data)) as im:
                          print('DECODE OK',im.format,im.size,flush=True)
                  except Exception as exc:
                      print('NOT IMAGE',str(exc),data[:100],flush=True)
              except Exception as exc: print('REQUEST FAIL',type(exc).__name__,str(exc),flush=True)
          PY