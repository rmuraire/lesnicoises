name: Finalize hotel expansion work branch

on:
  push:
    branches:
      - mametas-hotels-13-sep-work
  workflow_dispatch:

concurrency:
  group: mametas-hotel-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore generated hotel HTML to production source state
        run: |
          git fetch origin mametas-v3
          git rm -r --ignore-unmatch hotels en/hotels
          git checkout origin/mametas-v3 -- hotels en/hotels

      - name: Remove temporary work workflow
        run: git rm .github/workflows/materialize-hotel-work.yml

      - name: Commit clean production-ready diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare September 13 hotel expansion [skip ci]"
          git push
