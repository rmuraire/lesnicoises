name: Materialize hotel work branch

on:
  push:
    branches:
      - mametas-hotels-13-sep-work
  workflow_dispatch:

concurrency:
  group: mametas-hotel-work
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Add September 13 hotels
        run: python scripts/run_hotel_expansion_2026_09_13.py

      - name: Validate site
        run: python scripts/validate_mametas.py

      - name: Build inspection bundle
        run: |
          mkdir -p hotel-preview/fr hotel-preview/en
          cp fr/dormir/nice/index.html hotel-preview/fr/nice.html
          cp stay/nice/index.html hotel-preview/en/nice.html
          cp hotels/cannes/index.html hotel-preview/fr/cannes.html
          cp en/hotels/cannes/index.html hotel-preview/en/cannes.html
          cp hotels/saint-tropez/index.html hotel-preview/fr/saint-tropez.html
          cp en/hotels/saint-tropez/index.html hotel-preview/en/saint-tropez.html
          cp hotels/index.html hotel-preview/fr/hub.html
          cp en/hotels/index.html hotel-preview/en/hub.html

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: hotel-expansion-preview
          path: hotel-preview
          retention-days: 1
