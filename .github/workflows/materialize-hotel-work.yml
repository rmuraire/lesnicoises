name: Materialize hotel work branch

on:
  push:
    branches:
      - mametas-hotels-13-sep-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Run hotel augmentation and capture diagnostics
        run: |
          set +e
          python scripts/augment_hotels_2026_09_13.py > hotel-augment.log 2>&1
          status=$?
          echo "$status" > hotel-augment.status
          cat hotel-augment.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: hotel-augment-diagnostics
          path: |
            hotel-augment.log
            hotel-augment.status
          retention-days: 1
