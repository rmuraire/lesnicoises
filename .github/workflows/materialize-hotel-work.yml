name: Materialize hotel work branch

on:
  push:
    branches:
      - mametas-hotels-13-sep-work
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Add September 13 hotels
        run: python scripts/augment_hotels_2026_09_13.py

      - name: Validate site
        run: python scripts/validate_mametas.py

      - name: Commit materialized hotel HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotels en/hotels fr/dormir/nice stay/nice
          if git diff --cached --quiet; then
            echo "No materialized hotel changes to commit"
            exit 0
          fi
          git commit -m "Materialize September 13 hotel expansion [skip ci]"
          git push
