name: Mametas static advice and Cannes focused publish
on:
  push:
    branches:
      - mametas-fast-static-practical-2026-10-10
permissions:
  contents: read
  actions: read
concurrency:
  group: mametas-final-static-advice-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out production repair script and final CSS
        uses: actions/checkout@v4
      - name: Download public production snapshot
        uses: actions/download-artifact@v4
        with:
          name: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27
          run-id: 38035905075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Restore targeted generated pages and apply structural fix
        env:
          MAMETAS_PAGES: "en/riviera-guide/nice/index.html;riviera-guide/nice/index.html;en/riviera-guide/antibes/index.html;riviera-guide/antibes/index.html;en/riviera-guide/villefranche-cap-ferrat/index.html;riviera-guide/villefranche-cap-ferrat/index.html;en/riviera-guide/monaco/index.html;riviera-guide/monaco/index.html;en/riviera-guide/menton/index.html;riviera-guide/menton/index.html;en/riviera-guide/cannes/index.html;riviera-guide/cannes/index.html"
        run: |
          set -euo pipefail
          unzip -oq artifact/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip -d compiled
          for file in ${MAMETAS_PAGES//;/ }; do
            test -s "compiled/$file" || { echo "::error::Missing built file $file"; exit 1; }
            mkdir -p "$(dirname "$file")"
            cp "compiled/$file" "$file"
          done
          python scripts/v30_static_practical_cannes_sources_2026_10_10.py
          python - <<'PY'
          from pathlib import Path
          from re import sub
          for city in ("nice","antibes","villefranche-cap-ferrat","monaco","menton"):
              for lang in ("en/",""):
                  path=Path(lang+"riviera-guide/"+city+"/index.html")
                  s=path.read_text(encoding="utf-8")
                  assert s.count('data-mametas-practical-v2="true"')==1,path
                  assert s.count('class="mametas-practical-tip"')==3,path
                  heading="Trois décisions pratiques" if not lang else "Three practical decisions"
                  assert "<h2>"+heading+"</h2>" in s,path
          for lang in ("en/",""):
              path=Path(lang+"riviera-guide/cannes/index.html")
              s=path.read_text(encoding="utf-8")
              heading="Sources vérifiées" if not lang else "Sources checked"
              assert '<div class="sources"><h2>'+heading+'</h2></section>' not in s,path
              assert 'mametas-sources-section' in s,path
              assert '<div class="sources"><h2>'+heading+'</h2><ul>' in s,path
          pages=__import__("os").environ["MAMETAS_PAGES"].split(";")
          for rel in pages:
              path=Path(rel)
              s=path.read_text(encoding="utf-8")
              s=s.replace("/assets/mametas-foundation.css?v=1.3",
                          "/assets/mametas-foundation.css?v=1.4")
              assert "/assets/mametas-foundation.css?v=1.4" in s,rel
              path.write_text(s,encoding="utf-8")
          css=Path("assets/mametas-foundation.css").read_text(encoding="utf-8")
          assert "MAMETAS PRACTICAL STATIC V2" in css
          print("TARGETED GENERATED HTML AND FINAL CSS VERIFIED")
          PY
      - name: Install SFTP dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko
      - name: Deploy only the twelve guides and shared CSS to OVH
        env:
          MAMETAS_FORCE_FILES: "assets/mametas-foundation.css;en/riviera-guide/nice/index.html;riviera-guide/nice/index.html;en/riviera-guide/antibes/index.html;riviera-guide/antibes/index.html;en/riviera-guide/villefranche-cap-ferrat/index.html;riviera-guide/villefranche-cap-ferrat/index.html;en/riviera-guide/monaco/index.html;riviera-guide/monaco/index.html;en/riviera-guide/menton/index.html;riviera-guide/menton/index.html;en/riviera-guide/cannes/index.html;riviera-guide/cannes/index.html"
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py
      - name: Verify targeted pages and CSS served publicly
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import time
          def get(path):
              for attempt in range(5):
                  url="https://www.mametas.com"+path+"?practicalv2="+str(time.time_ns())
                  try:
                      with urlopen(Request(url,headers={"Cache-Control":"no-cache,no-store",
                          "User-Agent":"Mametas-Practical-Recipe-QA"}),timeout=25) as resp:
                          if resp.status==200:
                              return resp.read().decode("utf-8","replace")
                  except Exception as e:
                      print("RETRY",path,type(e).__name__,flush=True)
                  time.sleep(3)
              raise RuntimeError("Unavailable: "+path)
          assert "MAMETAS PRACTICAL STATIC V2" in get("/assets/mametas-foundation.css")
          for city in ("nice","antibes","villefranche-cap-ferrat","monaco","menton"):
              for prefix in ("/en/","/"):
                  path=prefix+"riviera-guide/"+city+"/"
                  s=get(path)
                  heading="Three practical decisions" if prefix=="/en/" else "Trois décisions pratiques"
                  assert '<h2>'+heading+'</h2>' in s,path
                  assert s.count('class="mametas-practical-tip"')==3,path
                  assert "/assets/mametas-foundation.css?v=1.4" in s,path
                  print("LIVE PRACTICAL PASS",path,flush=True)
          for prefix in ("/en/","/"):
              path=prefix+"riviera-guide/cannes/"
              s=get(path)
              heading="Sources checked" if prefix=="/en/" else "Sources vérifiées"
              assert "mametas-sources-section" in s,path
              assert '<div class="sources"><h2>'+heading+'</h2><ul>' in s,path
              assert '<h2>'+heading+'</h2></section>' not in s,path
              print("LIVE CANNES SOURCES PASS",path,flush=True)
          print("STATIC PRACTICAL + CANNES PUBLIC RECIPE VERIFIED",flush=True)
          PY
