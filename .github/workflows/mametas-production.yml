name: Mametas validate and deploy

on:
  push:
    branches:
      - mametas-v3
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mametas-production-v2
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko

      - name: Materialize editorial HTML
        run: python scripts/materialize_editorial_html.py

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Add September 13 hotels
        run: python scripts/run_hotel_expansion_2026_09_13.py

      - name: Apply Mametas editorial voice
        run: |
          python scripts/mametas_voice_pass.py
          python scripts/mametas_voice_hubs.py
          python scripts/mametas_voice_second_pass.py

      - name: Apply Claude audit corrections
        run: |
          python scripts/apply_claude_audit_2026_09_13.py
          python scripts/audit_hotfix_2026_09_14.py

      - name: Validate Claude audit corrections
        id: audit_validate
        continue-on-error: true
        run: python scripts/validate_claude_audit_2026_09_13.py > /tmp/mametas-audit-validation.log 2>&1

      - name: Report audit validation failure
        if: steps.audit_validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Audit validation failed on `%s`:\n\n```text\n' "${GITHUB_SHA}" > /tmp/mametas-audit-comment.md
          cat /tmp/mametas-audit-validation.log >> /tmp/mametas-audit-comment.md
          printf '\n```\n' >> /tmp/mametas-audit-comment.md
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/mametas-audit-comment.md

      - name: Stop before deploy on audit failure
        if: steps.audit_validate.outcome == 'failure'
        run: exit 1

      - name: Validate production site
        run: python scripts/validate_mametas.py

      - name: Deploy changed public files to OVH
        env:
          BEFORE_SHA: ${{ github.event.before }}
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Re-sync hotel sprites and CSS
        env:
          MAMETAS_FORCE_FILES: assets/hotel-batch.css;assets/hotels/batch-sprite.jpg;assets/hotels/batch-sprite-2026-09-13.jpg
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Check public homepage
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          req = Request("https://www.mametas.com/", headers={"User-Agent": "MametasDeployCheck/1.0"})
          with urlopen(req, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"mametas.com returned HTTP {response.status}")
              print("mametas.com is reachable (HTTP 200)")
          PY
