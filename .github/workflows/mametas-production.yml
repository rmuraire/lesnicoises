name: Mametas validate and deploy

on:
  push:
    branches:
      - mametas-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mametas-production-v2
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko

      - name: Materialize Nice practical stock
        run: python scripts/materialize_nice_pratique_stock.py

      - name: Materialize editorial HTML
        run: python scripts/materialize_editorial_html.py

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Add September 13 hotels
        run: python scripts/run_hotel_expansion_2026_09_13.py

      - name: Strengthen Nice hotel mid-range merchandising
        run: python scripts/nice_hotel_merchandising_2026_09_14.py

      - name: Add global hotel finder entry points
        run: python scripts/hotel_finder_hub_pass.py

      - name: Apply Mametas editorial voice
        run: |
          python scripts/mametas_voice_pass.py
          python scripts/mametas_voice_hubs.py
          python scripts/mametas_voice_second_pass.py

      - name: Apply Claude audit corrections
        run: |
          python scripts/apply_claude_audit_2026_09_13.py
          python scripts/audit_hotfix_2026_09_14.py

      - name: Simplify affiliate blocks and hotel exits
        run: python scripts/affiliate_and_hotel_exit_pass.py

      - name: Apply Astra decision paths
        run: python scripts/astra_ux_2026_09_16.py

      - name: Keep Places decision blocks inside editorial column
        run: python scripts/places_layout_hotfix_2026_09_16.py

      - name: Repair editorial card images
        run: python scripts/editorial_image_hotfix_2026_09_16.py

      - name: Add curated GetYourGuide activities
        run: python scripts/getyourguide_affiliate_pass.py

      - name: Materialize hotel finder inventory
        run: python scripts/materialize_hotel_finder_inventory.py

      - name: Apply hotel finder logic hotfix
        run: python scripts/hotel_finder_logic_hotfix.py

      - name: Add relative hotel prices and budget filter
        run: python scripts/hotel_price_budget_pass.py

      - name: Refresh final V1 acquisition copy
        run: python scripts/v1_release_copy_pass.py

      - name: Route hotel affiliate links to Booking via CJ
        run: python scripts/booking_cj_affiliate_pass.py

      - name: Open external links in new tabs
        run: python scripts/external_links_new_tab.py

      - name: Apply final recipe polish
        run: python scripts/final_recipe_polish_2026_09_18.py

      - name: Remove AI-copy tells and long dashes
        run: python scripts/human_copy_seo_pass_2026_09_18.py

      - name: Stabilize final Astra audit fixes
        run: python scripts/final_audit_stabilization_2026_09_18.py

      - name: Apply Riviera Chooser homepage entry
        run: python scripts/riviera_chooser_home_pass.py

      - name: Enforce short-dash house style
        run: python scripts/no_long_dash_pass.py

      - name: Validate Riviera Chooser decision engine
        run: node assets/riviera-chooser.js --self-test

      - name: Validate Claude audit corrections
        run: python scripts/validate_claude_audit_2026_09_13.py

      - name: Validate V1 release layer
        run: python scripts/validate_v1_release.py

      - name: Validate production site
        run: python scripts/validate_mametas.py

      - name: Deploy changed public files to OVH
        env:
          BEFORE_SHA: ${{ github.event.before }}
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Re-sync critical static assets
        env:
          MAMETAS_FORCE_FILES: assets/site.css;assets/site.js;assets/v3.css;assets/v3.js;riviera-guide/index.html;bons-plans/index.html;en/good-finds/index.html;assets/hotel-engine.js;assets/hotel-finder-nice.json;fr/planifier/cinq-jours-nice-sans-voiture/index.html;riviera-guide/monaco/index.html;riviera-guide/menton/index.html;en/day-trips/index.html;sitemap-hotels-batch2.xml;assets/editorial/about-mameta-2026-09-18.webp;assets/hotel-batch.css;assets/hotel-engine.css;assets/hotel-engine.js;assets/hotels/batch-sprite.jpg;assets/hotels/batch-sprite-2026-09-13.jpg;assets/editorial/iles-lerins.jpg;assets/editorial/culture-musee-matisse.webp;assets/editorial/culture-musee-picasso-antibes.webp;assets/activity-affiliates.css;assets/editorial/activity-nice-castle-hill.avif;assets/editorial/activity-eze-monaco.avif;assets/editorial/activity-cannes-antibes-saint-paul.avif;assets/editorial/activity-villefranche-cap-ferrat-boat.avif;assets/editorial/activity-saint-tropez-boat.avif;index.html;fr/index.html;en/gay-nice/index.html;guide-gay-nice/index.html;en/riviera-guide/cannes/index.html;riviera-guide/cannes/index.html;en/riviera-guide/eze/index.html;riviera-guide/eze/index.html;en/riviera-guide/saint-paul-de-vence/index.html;riviera-guide/saint-paul-de-vence/index.html;en/riviera-guide/saint-tropez/index.html;riviera-guide/saint-tropez/index.html;assets/editorial/mametas-explore-restaurants-salad.webp;assets/hotels/hotel-le-grimaldi-by-happyculture/hero.webp;assets/hotels/hotel-le-grimaldi-by-happyculture/gallery-1.webp;assets/hotels/hotel-le-grimaldi-by-happyculture/gallery-2.webp;assets/hotels/hotel-beau-rivage/hero.webp;assets/hotels/hotel-beau-rivage/gallery-1.webp;assets/hotels/hotel-beau-rivage/gallery-2.webp;assets/hotels/boscolo-nice-hotel-and-spa/hero.webp;assets/hotels/boscolo-nice-hotel-and-spa/gallery-1.webp;assets/hotels/boscolo-nice-hotel-and-spa/gallery-2.webp;assets/hotels/le-negresco/hero.jpg;assets/riviera-chooser.css;assets/riviera-chooser.js;en/riviera-chooser/index.html;riviera-chooser/index.html;sitemap.xml;methode/index.html;en/method/index.html;lexique/index.html;en/lexicon/index.html;plages/index.html;en/beaches/index.html;plages/nice/index.html;en/beaches/nice/index.html;plages/autour-de-nice/index.html;en/beaches/around-nice/index.html;plages/antibes/index.html;en/beaches/antibes/index.html;plages/saint-tropez/index.html;en/beaches/saint-tropez/index.html;bons-plans/transfert-aeroport-nice/index.html;en/good-finds/nice-airport-transfer/index.html;bons-plans/septembre-2026/index.html;en/good-finds/september-2026/index.html;a-propos/index.html;en/about/index.html;plan/five-days-nice-no-car/index.html;hotels/finder/index.html;en/hotels/finder/index.html
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Check refreshed Explore and Gay Nice
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          sha = os.environ.get("GITHUB_SHA", "release")
          checks = {
              f"https://www.mametas.com/?deploy={sha}": (
                  "mametas-explore-restaurants-salad.webp",
                  "sculpture-4080986_1280.jpg",
                  'class="lgbtq-banner"',
                  'class="first-trip-grid"',
                  '<a class="first-trip-card" href=',
                  'class="wrap home-lgbtq-wrap"',
                  "/en/gay-french-riviera/",
                  'class="v3-section chooser-signature-section"',
                  'href="/en/riviera-chooser/?days=5"',
              ),
              f"https://www.mametas.com/fr/?deploy={sha}": (
                  "mametas-explore-restaurants-salad.webp",
                  "sculpture-4080986_1280.jpg",
                  'class="lgbtq-banner"',
                  'class="first-trip-grid"',
                  '<a class="first-trip-card" href=',
                  'class="wrap home-lgbtq-wrap"',
                  "/cote-dazur-gay/",
                  'class="v3-section chooser-signature-section"',
                  'href="/riviera-chooser/?days=5"',
              ),
              f"https://www.mametas.com/en/gay-nice/?deploy={sha}": (
                  'class="place gay-hotel-card"',
                  "/assets/hotels/hotel-le-grimaldi-by-happyculture/hero.webp",
                  "/assets/hotels/hotel-beau-rivage/hero.webp",
                  "/assets/hotels/boscolo-nice-hotel-and-spa/hero.webp",
              ),
              f"https://www.mametas.com/guide-gay-nice/?deploy={sha}": (
                  'class="place gay-hotel-card"',
                  "/assets/hotels/hotel-le-grimaldi-by-happyculture/hero.webp",
                  "/assets/hotels/hotel-beau-rivage/hero.webp",
                  "/assets/hotels/boscolo-nice-hotel-and-spa/hero.webp",
              ),
          }
          for url, needles in checks.items():
              req = Request(url, headers={"User-Agent": "MametasDeployCheck/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status != 200:
                      raise SystemExit(f"{url} returned HTTP {response.status}")
                  missing = [needle for needle in needles if needle not in body]
                  if missing:
                      raise SystemExit(f"{url} is missing refreshed markers: {missing}")
                  if "mametas.com/?deploy=" in url or "mametas.com/fr/?deploy=" in url:
                      base_pos = body.find('id="bases"')
                      gay_pos = body.find('class="wrap home-lgbtq-wrap"')
                      first_trip_pos = body.find('id="riviera-first-trip-edit"')
                      if not (base_pos >= 0 and base_pos < gay_pos < first_trip_pos):
                          raise SystemExit(f"{url} homepage order is wrong: base={base_pos}, gay={gay_pos}, first-trip={first_trip_pos}")
                  print(f"Refreshed page check passed: {url}")
          PY

      - name: Check Riviera Chooser production
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          sha = os.environ.get("GITHUB_SHA", "release")
          checks = {
              f"https://www.mametas.com/en/riviera-chooser/?deploy={sha}": (
                  "Tell us about your trip. We’ll make the call.",
                  'data-group="days"',
                  'data-group="mobility"',
                  'data-group="mood"',
                  'data-group="pace"',
                  "/assets/riviera-chooser.js?v=4",
              ),
              f"https://www.mametas.com/riviera-chooser/?deploy={sha}": (
                  "Parlez-nous de votre séjour. On tranche pour vous.",
                  'data-group="days"',
                  'data-group="mobility"',
                  'data-group="mood"',
                  'data-group="pace"',
                  "/assets/riviera-chooser.js?v=4",
              ),
          }
          for url, needles in checks.items():
              req = Request(url, headers={"User-Agent": "MametasDeployCheck/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status != 200:
                      raise SystemExit(f"{url} returned HTTP {response.status}")
                  missing = [needle for needle in needles if needle not in body]
                  if missing:
                      raise SystemExit(f"{url} is missing Chooser markers: {missing}")
                  print(f"Riviera Chooser production check passed: {url}")
          PY

      - name: Check expanded destination authority pages
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          sha = os.environ.get("GITHUB_SHA", "release")
          checks = {
              f"https://www.mametas.com/en/riviera-guide/cannes/?deploy={sha}": (
                  "Cannes: the polished base that actually works",
                  "One day in Cannes",
                  "Cannes without a car",
              ),
              f"https://www.mametas.com/riviera-guide/cannes/?deploy={sha}": (
                  "Cannes : la base chic qui fonctionne vraiment",
                  "Une journée à Cannes",
                  "Cannes sans voiture",
              ),
              f"https://www.mametas.com/en/riviera-guide/eze/?deploy={sha}": (
                  "Èze: spectacular, crowded",
                  "Èze Village and Èze-sur-Mer",
                  "Nietzsche Trail",
              ),
              f"https://www.mametas.com/riviera-guide/eze/?deploy={sha}": (
                  "Èze : spectaculaire, fréquenté",
                  "Èze Village et Èze-sur-Mer",
                  "sentier de Nietzsche",
              ),
              f"https://www.mametas.com/en/riviera-guide/saint-paul-de-vence/?deploy={sha}": (
                  "How long do you actually need?",
                  "Saint-Paul-de-Vence or Èze?",
                  "Fondation Maeght",
              ),
              f"https://www.mametas.com/riviera-guide/saint-paul-de-vence/?deploy={sha}": (
                  "Combien de temps faut-il vraiment",
                  "Saint-Paul-de-Vence ou Èze",
                  "Fondation Maeght",
              ),
              f"https://www.mametas.com/en/riviera-guide/saint-tropez/?deploy={sha}": (
                  "Day trip or overnight?",
                  "Place des Lices",
                  "Pampelonne",
              ),
              f"https://www.mametas.com/riviera-guide/saint-tropez/?deploy={sha}": (
                  "Excursion à la journée ou une nuit sur place",
                  "place des Lices",
                  "Pampelonne",
              ),
          }
          for url, needles in checks.items():
              req = Request(url, headers={"User-Agent": "MametasDeployCheck/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status != 200:
                      raise SystemExit(f"{url} returned HTTP {response.status}")
                  missing = [needle for needle in needles if needle not in body]
                  if missing:
                      raise SystemExit(f"{url} is missing destination markers: {missing}")
                  print(f"Destination authority check passed: {url}")
          PY

      - name: Check public homepage
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          req = Request("https://www.mametas.com/", headers={"User-Agent": "MametasDeployCheck/1.0"})
          with urlopen(req, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"mametas.com returned HTTP {response.status}")
              print("mametas.com is reachable (HTTP 200)")
          PY

      - name: Check public V1 release pages
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          sha = os.environ.get("GITHUB_SHA", "release")
          checks = {
              f"https://www.mametas.com/hotels/finder/?deploy={sha}": (
                  'data-engine-group="budget"',
                  '/assets/hotel-engine.js?v=4',
                  'Cinq décisions. Puis seulement les hôtels.',
              ),
              f"https://www.mametas.com/fr/dormir/nice/?deploy={sha}": (
                  'hotel-price-band',
                  'data-price-band=',
                  'Booking.com',
              ),
              f"https://www.mametas.com/en/hotels/finder/?deploy={sha}": (
                  'data-engine-group="budget"',
                  '/assets/hotel-engine.js?v=4',
                  'Five decisions. Then the hotels.',
              ),
              f"https://www.mametas.com/en/good-finds/?deploy={sha}": (
                  'class="card seasonal-card"',
                  'About Mametas',
                  '>NOW<',
              ),
              f"https://www.mametas.com/en/about/?deploy={sha}": (
                  'about-mameta-2026-09-18.webp',
                  'The character is invented. The recommendation is not.',
                  'About Mametas',
              ),
              f"https://www.mametas.com/stay/nice/?deploy={sha}": (
                  'About Mametas',
                  'Navigate',
                  'Stay',
              ),
          }
          for url, needles in checks.items():
              req = Request(url, headers={"User-Agent": "MametasDeployCheck/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status != 200:
                      raise SystemExit(f"{url} returned HTTP {response.status}")
                  missing = [needle for needle in needles if needle not in body]
                  if missing:
                      raise SystemExit(f"{url} is missing release markers: {missing}")
                  print(f"Public release check passed: {url}")
          PY

      - name: Build V1 backup archive
        run: |
          zip -qr Mametas_V1_2026-09-19.zip . -x '.git/*' 'Mametas_V1_2026-09-19.zip'

      - name: Upload V1 backup archive
        uses: actions/upload-artifact@v4
        with:
          name: Mametas_V1_2026-09-19
          path: Mametas_V1_2026-09-19.zip
          retention-days: 30
