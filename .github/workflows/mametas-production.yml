name: Mametas validate and deploy

on:
  push:
    branches:
      - mametas-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mametas-production-v3-final
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko pillow

      - name: Materialize Nice practical stock
        run: python scripts/materialize_nice_pratique_stock.py

      - name: Materialize Renaud Nice photos
        run: python scripts/materialize_renaud_photos.py

      - name: Materialize editorial HTML
        run: python scripts/materialize_editorial_html.py

      - name: Materialize hotel hubs
        run: python scripts/materialize_hotel_hubs.py

      - name: Add September 13 hotels
        run: python scripts/run_hotel_expansion_2026_09_13.py

      - name: Strengthen Nice hotel mid-range merchandising
        run: python scripts/nice_hotel_merchandising_2026_09_14.py

      - name: Add global hotel finder entry points
        run: python scripts/hotel_finder_hub_pass.py

      - name: Apply Mametas editorial voice
        run: |
          python scripts/mametas_voice_pass.py
          python scripts/mametas_voice_hubs.py
          python scripts/mametas_voice_second_pass.py

      - name: Apply Claude audit corrections
        run: |
          python scripts/apply_claude_audit_2026_09_13.py
          python scripts/audit_hotfix_2026_09_14.py

      - name: Simplify affiliate blocks and hotel exits
        run: python scripts/affiliate_and_hotel_exit_pass.py

      - name: Apply Astra decision paths
        run: python scripts/astra_ux_2026_09_16.py

      - name: Keep Places decision blocks inside editorial column
        run: python scripts/places_layout_hotfix_2026_09_16.py

      - name: Repair editorial card images
        run: python scripts/editorial_image_hotfix_2026_09_16.py

      - name: Add curated GetYourGuide activities
        run: python scripts/getyourguide_affiliate_pass.py

      - name: Materialize hotel finder inventory
        run: python scripts/materialize_hotel_finder_inventory.py

      - name: Apply hotel finder logic hotfix
        run: python scripts/hotel_finder_logic_hotfix.py

      - name: Add relative hotel prices and budget filter
        run: python scripts/hotel_price_budget_pass.py

      - name: Refresh final V1 acquisition copy
        run: python scripts/v1_release_copy_pass.py

      - name: Route hotel affiliate links to Booking via CJ
        run: python scripts/booking_cj_affiliate_pass.py

      - name: Open external links in new tabs
        run: python scripts/external_links_new_tab.py

      - name: Apply final recipe polish
        run: python scripts/final_recipe_polish_2026_09_18.py

      - name: Remove AI-copy tells and long dashes
        run: python scripts/human_copy_seo_pass_2026_09_18.py

      - name: Stabilize final Astra audit fixes
        run: python scripts/final_audit_stabilization_2026_09_18.py

      - name: Apply Riviera Chooser homepage entry
        run: python scripts/riviera_chooser_home_pass.py

      - name: Enforce short-dash house style
        run: python scripts/no_long_dash_pass.py

      - name: Apply V2 closure audit fixes
        run: python scripts/v2_closure_audit_fixes_2026_09_24.py

      - name: Apply V3 product surface
        run: python scripts/v3_product_surface_2026_09_25.py

      - name: Apply V3 Hotel Fit foundation
        run: python scripts/v3_hotel_fit_foundation_2026_09_25.py

      - name: Apply V3 culture practical layer
        run: python scripts/v3_culture_practical_layer_2026_09_25.py

      - name: Apply V3 destination Reality Check
        run: python scripts/v3_destination_reality_layer_2026_09_25.py

      - name: Apply V3 credibility layer
        run: python scripts/v3_credibility_layer_2026_09_25.py

      - name: Apply V3 Gay Nice practical layer
        run: python scripts/v3_gay_nice_practical_layer_2026_09_25.py

      - name: Apply V3 architecture phase 2
        run: python scripts/v3_architecture_phase2_2026_09_25.py

      - name: Apply V3 phase 3 content reclassification
        run: python scripts/v3_reclassify_existing_2026_09_25.py

      - name: Apply V3 homepage dispatch
        run: python scripts/v3_homepage_dispatch_2026_09_25.py

      - name: Apply V3 phase 4 reference content
        run: python scripts/v3_phase4_reference_content_2026_09_25.py

      - name: Apply V3 harmonisation and clarification
        run: python scripts/v3_harmonisation_phase5_2026_09_25.py

      - name: Final V3 copy hygiene
        run: python scripts/no_long_dash_pass.py

      - name: Validate Riviera Chooser decision engine
        run: node assets/riviera-chooser.js --self-test

      - name: Validate Claude audit corrections
        run: python scripts/validate_claude_audit_2026_09_13.py

      - name: Validate V1 release layer
        run: python scripts/validate_v1_release.py

      - name: Migrate canonical Mametas Riviera Fit route
        run: python scripts/v3_riviera_fit_route_2026_09_25.py

      - name: Apply V3 presentation polish
        run: python scripts/v3_presentation_polish_2026_09_25.py

      - name: Apply V3 UX adoption layer
        run: python scripts/v3_adoption_layer_2026_09_25.py

      - name: Apply final marginal recipe
        run: python scripts/v3_final_marginal_recipe_2026_09_25.py

      - name: Apply closure QA fixes
        run: python scripts/v3_closure_qa_2026_09_25.py

      - name: Apply final mobile and visual closure
        run: python scripts/v3_final_mobile_visual_2026_09_26.py

      - name: Apply semantic clarity closure
        run: python scripts/v3_semantic_clarity_2026_09_27.py

      - name: Apply solo female Riviera vertical
        run: |
          cat scripts/v4_solo_female_vertical_2026_09_29.py.gz.b64.part00 scripts/v4_solo_female_vertical_2026_09_29.py.gz.b64.part01 scripts/v4_solo_female_vertical_2026_09_29.py.gz.b64.part02 scripts/v4_solo_female_vertical_2026_09_29.py.gz.b64.part03 | base64 -d | gzip -dc > scripts/v4_solo_female_vertical_2026_09_29.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/v4_solo_female_vertical_2026_09_29.py")
          src=p.read_text(encoding="utf-8")
          src=src.replace("s.find('class=\"lgbtq-banner\"')","s.find('class=\"lgbtq-banner')")
          replacements = {
              "Meilleure première base : Nice": "Meilleur premier point de chute : Nice",
              "Choisissez la base en pensant au soir": "Choisissez le point de chute en pensant au soir",
              "La base solo la plus facile.": "Le point de chute solo le plus simple.",
              "c’est la base solo la plus simple": "c’est le point de chute solo le plus simple",
              "Une base, quatre journées faciles": "Un point de chute, quatre journées faciles",
              "Une bonne base à Cannes": "Un bon point de chute à Cannes",
              "pas la base la plus efficace de toute la côte": "pas le point de chute le plus efficace de toute la côte",
              "Base : Nice, 5 nuits": "Point de chute : Nice, 5 nuits",
              "meilleure base, sécurité": "meilleur point de chute, sécurité",
              "base à Nice, Villefranche": "point de chute à Nice, Villefranche",
              "une base, sans voiture": "un point de chute, sans voiture",
              "garde Nice comme base": "garde Nice comme point de chute",
              "en faire la base solo": "en faire le point de chute solo",
          }
          for old_text,new_text in replacements.items():
              src=src.replace(old_text,new_text)
          p.write_text(src,encoding="utf-8")
          PY
          python scripts/v4_solo_female_vertical_2026_09_29.py

      - name: Apply Explore and Practical clarity pass
        run: |
          base64 -d scripts/v4_restructure_explore_practical_2026_09_30.py.gz.b64 | gzip -dc > scripts/v4_restructure_explore_practical_2026_09_30.py
          python scripts/v4_restructure_explore_practical_2026_09_30.py

      - name: Apply cosmetic closure
        continue-on-error: true
        run: |
          base64 -d scripts/v4_cosmetic_cleanup_2026_09_30.py.gz.b64 | gzip -dc > scripts/v4_cosmetic_cleanup_2026_09_30.py
          python scripts/v4_cosmetic_cleanup_2026_09_30.py

      - name: Apply final layout refinement
        run: |
          base64 -d scripts/v4_layout_refinement_2026_09_30.py.gz.b64 | gzip -dc > scripts/v4_layout_refinement_2026_09_30.py
          python scripts/v4_layout_refinement_2026_09_30.py

      - name: Apply Plan visual and editorial density refinement
        run: |
          base64 -d scripts/v4_editorial_density_plan_visual_2026_09_30.py.gz.b64 | gzip -dc > scripts/v4_editorial_density_plan_visual_2026_09_30.py
          python scripts/v4_editorial_density_plan_visual_2026_09_30.py

      - name: Audit Hotel Fit coverage
        run: python scripts/v3_hotel_fit_coverage_audit_2026_09_25.py

      - name: Validate production site
        run: python scripts/validate_mametas.py

      - name: Build user delivery V3 snapshot
        run: |
          rm -f Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip
          zip -qr Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip . -x '.git/*' 'Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip'

      - name: Upload user delivery V3 snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27
          path: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip
          retention-days: 30

      - name: Deploy changed public files to OVH
        env:
          BEFORE_SHA: ${{ github.event.before }}
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Re-sync critical static assets
        env:
          MAMETAS_FORCE_FILES: .htaccess;assets/site.css;assets/site.js;assets/v3.css;assets/v3.js;assets/consent.js;assets/editorial-layer.js;riviera-fit/index.html;en/riviera-fit/index.html;riviera-guide/index.html;bons-plans/index.html;en/good-finds/index.html;assets/hotel-engine.js;assets/hotel-finder-nice.json;fr/planifier/cinq-jours-nice-sans-voiture/index.html;riviera-guide/monaco/index.html;riviera-guide/menton/index.html;en/day-trips/index.html;sitemap-hotels-batch2.xml;assets/editorial/about-mameta-2026-09-18.webp;assets/hotel-batch.css;assets/hotel-engine.css;assets/hotel-engine.js;assets/hotels/batch-sprite.jpg;assets/hotels/batch-sprite-2026-09-13.jpg;assets/editorial/iles-lerins.jpg;assets/editorial/fondation-maeght-waterborough.webp;assets/editorial/beaches/baie-des-fourmis-final.jpg;assets/editorial/beaches/petite-afrique-final.jpg;assets/editorial/beaches/mala-commons.jpg;assets/editorial/beaches/fossettes-commons.jpg;assets/editorial/beaches/passable-pexels.jpg;assets/editorial/beaches/antibes-gravette-deposit.jpg;assets/editorial/culture-musee-matisse.webp;assets/editorial/culture-musee-picasso-antibes.webp;assets/activity-affiliates.css;assets/editorial/activity-nice-castle-hill.avif;assets/editorial/activity-eze-monaco.avif;assets/editorial/activity-cannes-antibes-saint-paul.avif;assets/editorial/activity-villefranche-cap-ferrat-boat.avif;assets/editorial/activity-saint-tropez-boat.avif;index.html;fr/index.html;en/gay-nice/index.html;guide-gay-nice/index.html;cote-dazur-gay/index.html;en/gay-french-riviera/index.html;en/gay-french-riviera/where-to-stay/index.html;cote-dazur-gay/ou-dormir/index.html;en/gay-french-riviera/beaches-without-a-car/index.html;cote-dazur-gay/plages-sans-voiture/index.html;bons-plans/carnaval-nice/index.html;en/good-finds/nice-carnival/index.html;bons-plans/ironman-nice/index.html;en/good-finds/ironman-nice/index.html;bons-plans/mipim-cannes/index.html;en/good-finds/mipim-cannes/index.html;riviera-guide/cote-dazur-ou-cot