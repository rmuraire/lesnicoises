          sha = os.environ.get("GITHUB_SHA", "release")
          checks = {
              f"https://www.mametas.com/plan/?deploy={sha}": ("phase4-plan-depth", "plan-riviera-fit-panel", 'data-riviera-chooser', 'data-chooser-submit', "harmonisation-plan-visual", "/plan/real-budget/"),
