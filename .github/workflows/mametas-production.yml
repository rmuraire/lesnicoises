        run: |
          python - <<'PY'
          import html, os, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET

          sha = os.environ.get("GITHUB_SHA", "release")
          headers = {"User-Agent":"MametasSemanticCrawler/1.0","Cache-Control":"no-cache"}

          def busted(url):
              parts = urlsplit(url)
              q = dict(parse_qsl(parts.query, keep_blank_values=True))
              q["semantic"] = sha
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(q), parts.fragment))

          def fetch(url):
              req = Request(busted(url), headers=headers)
              with urlopen(req, timeout=30) as response:
                  return response.status, response.read().decode("utf-8", errors="replace"), response.geturl()

          sitemap_status, sitemap_body, _ = fetch("https://www.mametas.com/sitemap.xml")
          if sitemap_status != 200:
              raise SystemExit(f"sitemap returned {sitemap_status}")
          root = ET.fromstring(sitemap_body)
          ns = {"sm":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [n.text.strip() for n in root.findall(".//sm:loc", ns) if n.text and n.text.startswith("https://www.mametas.com/")]

          def inspect(url):
              status, body, final_url = fetch(url)
              if status != 200:
                  return [f"{url}: HTTP {status}"]
              m = re.search(r'<html[^>]+lang=["\']([^"\']+)', body, re.I)
              lang = (m.group(1).lower() if m else "")
              vis = re.sub(r'<script\b[^>]*>[\s\S]*?</script>', ' ', body, flags=re.I)
              vis = re.sub(r'<style\b[^>]*>[\s\S]*?</style>', ' ', vis, flags=re.I)
              vis = re.sub(r'<[^>]+>', ' ', vis)
              vis = re.sub(r'\s+', ' ', html.unescape(vis)).strip()
              issues=[]
              if lang.startswith("fr"):
                  for raw,label in (
                      (r'>\s*Reality Check\s*<',"Reality Check"),
                      (r'<b>\s*Pression budget\s*</b>',"Pression budget"),
                      (r'<b>\s*Friction\s*</b>',"Friction"),
                      (r'MAMETAS HOTEL TAKE',"MAMETAS HOTEL TAKE"),
                      (r'>\s*Mametas rule\s*<',"Mametas rule"),
                  ):
                      if re.search(raw,body,re.I):
                          issues.append(f"{url}: legacy FR UI label {label}")
              elif lang.startswith("en"):
                  for raw,label in (
                      (r'<b>\s*Déplacements\s*</b>',"Déplacements"),
                      (r'<b>\s*Logistique\s*</b>',"Logistique"),
                      (r'>\s*LA PROCHAINE DÉCISION\s*<',"LA PROCHAINE DÉCISION"),
                  ):
                      if re.search(raw,body,re.I):
                          issues.append(f"{url}: French UI label on EN page {label}")
              return issues

          errors=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futs={pool.submit(inspect,u):u for u in urls}
              for fut in as_completed(futs):
                  try:
                      errors.extend(fut.result())
                  except Exception as exc:
                      errors.append(f"{futs[fut]}: fetch error {exc}")

          if errors:
              raise SystemExit("Live semantic crawl failed:\n- " + "\n- ".join(errors[:80]))
          print(f"Exhaustive live semantic crawl passed on {len(urls)} sitemap URLs")
          PY

      - name: Build V3 final archive
        run: |
          zip -qr Mametas_V3_FINAL_2026-09-27_SITE.zip . -x '.git/*' 'Mametas_V3_FINAL_2026-09-27_SITE.zip'

      - name: Upload V3 final archive
        uses: actions/upload-artifact@v4
        with:
          name: Mametas_V3_FINAL_2026-09-27_SITE
          path: Mametas_V3_FINAL_2026-09-27_SITE.zip
          retention-days: 30
