      - name: Check solo female Riviera production
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          sha=os.environ.get("GITHUB_SHA","release")
          checks={
              f"https://www.mametas.com/en/solo-female-french-riviera/?deploy={sha}":("/assets/editorial/solo-female-riviera-nice-sergio-pulp.jpg","/en/solo-female-french-riviera/where-to-stay/"),
              f"https://www.mametas.com/en/solo-female-french-riviera/safety/?deploy={sha}":("112","City of Nice"),
              f"https://www.mametas.com/en/solo-female-french-riviera/where-to-stay/?deploy={sha}":("Apollinaire","Villa Victoria"),
              f"https://www.mametas.com/en/solo-female-french-riviera/getting-around-without-a-car/?deploy={sha}":("Nice → Antibes","Nice → Menton"),
              f"https://www.mametas.com/en/solo-female-french-riviera/eating-going-out-alone/?deploy={sha}":("Opéra Nice Côte d’Azur","Bobar Comedy Club"),
              f"https://www.mametas.com/en/solo-female-french-riviera/5-day-itinerary/?deploy={sha}":("DAY 1","DAY 5"),
              f"https://www.mametas.com/cote-dazur-femme-solo/?deploy={sha}":("/assets/editorial/solo-female-riviera-nice-sergio-pulp.jpg","/cote-dazur-femme-solo/ou-dormir/"),
              f"https://www.mametas.com/cote-dazur-femme-solo/securite/?deploy={sha}":("112","Ville de Nice"),
              f"https://www.mametas.com/cote-dazur-femme-solo/ou-dormir/?deploy={sha}":("Apollinaire","Villa Victoria"),
              f"https://www.mametas.com/cote-dazur-femme-solo/se-deplacer-sans-voiture/?deploy={sha}":("Nice → Antibes","Nice → Menton"),
              f"https://www.mametas.com/cote-dazur-femme-solo/manger-sortir-seule/?deploy={sha}":("Opéra Nice Côte d’Azur","Bobar Comedy Club"),
              f"https://www.mametas.com/cote-dazur-femme-solo/itineraire-5-jours/?deploy={sha}":("JOUR 1","JOUR 5"),
              f"https://www.mametas.com/en/explore/?deploy={sha}":("SOLO FEMALE FRENCH RIVIERA","/en/solo-female-french-riviera/"),
              f"https://www.mametas.com/explore/?deploy={sha}":("FEMME SOLO SUR LA RIVIERA","/cote-dazur-femme-solo/"),
          }
          for url,needles in checks.items():
              req=Request(url,headers={"User-Agent":"MametasSoloFemaleCheck/1.0","Cache-Control":"no-cache"})
              with urlopen(req,timeout=30) as response:
                  body=response.read().decode("utf-8",errors="replace")
                  missing=[n for n in needles if n not in body]
                  if response.status != 200 or missing:
                      raise SystemExit(f"{url} failed solo-female check: status={response.status} missing={missing}")
                  print("Solo female page check passed:",url)
          PY

