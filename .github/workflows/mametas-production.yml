              f"https://www.mametas.com/explore/2-3-heures/?deploy={sha}": ("Vous n’avez que 2 ou 3 heures ? Très bien.", "Villefranche-sur-Mer", "Èze"),
              f"https://www.mametas.com/en/practical/weather-by-season/?deploy={sha}": ("Spring", "Winter"),
              f"https://www.mametas.com/pratique/climat-saisons/?deploy={sha}": ("Printemps", "Hiver"),
              f"https://www.mametas.com/en/practical/?deploy={sha}": ("practical-harmonised", "harmonisation-practical-visual", "practical-extra-card"),
              f"https://www.mametas.com/en/explore/?deploy={sha}": ("explore-harmonised", "lgbtq-banner--fifth", "phase4-short-entry"),
              f"https://www.mametas.com/en/hotels/?deploy={sha}": ("Find the right hotel. Start with the right base.",),
              f"https://www.mametas.com/en/hotels/without-a-car/?deploy={sha}": ("harmonisation-without-car-visual", "next-decisions-compact"),
