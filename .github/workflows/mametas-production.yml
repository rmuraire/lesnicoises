              f"https://www.mametas.com/en/beaches/?deploy={sha}": ("beach-harmonised", "beach-visual-pair"),
          }
          for url, needles in checks.items():
              req = Request(url, headers={"User-Agent": "MametasDeployCheck/1.0", "Cache-Control": "no-cache"})
              with urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  if response.status != 200:
                      raise SystemExit(f"{url} returned HTTP {response.status}")
