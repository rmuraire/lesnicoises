      - name: Check V5 intent pillars live
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen

          sha=os.environ.get("GITHUB_SHA","release")
          paths=[
              "/en/explore/french-riviera-honeymoon/",
              "/explore/lune-de-miel-cote-d-azur/",
              "/en/explore/french-riviera-babymoon/",
              "/explore/babymoon-cote-d-azur/",
              "/en/explore/french-riviera-proposal/",
              "/explore/demande-en-mariage-cote-d-azur/",
              "/en/explore/living-antibes-expat/",
              "/explore/vivre-antibes-expatrie/",
              "/en/explore/retire-french-riviera/",
              "/explore/retraite-cote-d-azur/",
          ]
          errors=[]
          for page in paths:
              url=f"https://www.mametas.com{page}?deploy={sha}"
              req=Request(url,headers={"User-Agent":"MametasRefonteLive/1.0","Cache-Control":"no-cache"})
              try:
                  html=urlopen(req,timeout=20).read().decode("utf-8","replace")
              except Exception as exc:
                  errors.append(f"{page}: fetch failed: {exc}")
                  continue
              for token in ('intent-hierarchy-refonte-2026-10-01','segment-hotel-grid','class="intent-faq"','/assets/v3.css?v='):
                  if token not in html:
                      errors.append(f"{page}: missing {token}")
          css_url=f"https://www.mametas.com/assets/v3.css?deploy={sha}"
          try:
              css=urlopen(Request(css_url,headers={"User-Agent":"MametasRefonteLive/1.0","Cache-Control":"no-cache"}),timeout=20).read().decode("utf-8","replace")
              for token in ('Intent hierarchy + affiliate refonte — 2026-10-01','.segment-hotel-card','.decision-first'):
                  if token not in css:
                      errors.append(f"v3.css missing {token}")
          except Exception as exc:
              errors.append(f"v3.css fetch failed: {exc}")
          if errors:
              raise SystemExit("\n".join("ERROR "+e for e in errors))
          print("Explore refonte live check OK:",len(paths),"pages")
          PY

