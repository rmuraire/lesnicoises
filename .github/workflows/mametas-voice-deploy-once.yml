name: Mametas one-time voice deployment

on:
  push:
    branches:
      - mametas-v3

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet paramiko
      - run: python scripts/validate_mametas.py
      - name: Upload recalibrated pages
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
          MAMETAS_FORCE_FILES: en/riviera-guide/nice/index.html;riviera-guide/nice/index.html;en/riviera-guide/nice-or-cannes/index.html;riviera-guide/nice-ou-cannes/index.html
        run: python scripts/deploy_changed_ftps.py
