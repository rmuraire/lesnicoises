name: Mametas V6 shell hotfix CI
on:
  push:
    branches: [fix/v6-shell-regex-2026-10-02]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile scripts/v6_coherence_envelope_2026_10_02.py scripts/validate_v6_coherence_envelope_2026_10_02.py
      - run: python scripts/v6_coherence_envelope_2026_10_02.py
      - run: python scripts/validate_v6_coherence_envelope_2026_10_02.py
