name: Mametas one-time repair

on:
  push:
    branches:
      - mametas-v3

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize legacy HTML
        run: python scripts/repair_mametas_html.py

      - name: Validate repaired site
        run: python scripts/validate_mametas.py

      - name: Commit repairs if needed
        run: |
          if git diff --quiet; then
            echo "No repairs needed."
            exit 0
          fi
          git config user.name "mametas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Repair Mametas legacy HTML validation issues"
          git push origin HEAD:mametas-v3
