name: Mametas template DOM inspection
on:
  push:
    branches:
      - mametas-recipe-links-hotelcards-2026-10-10
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27
          run-id: 38047128241
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Inspect generated intro, CTAs, restaurant link classes, guide templates
        run: |
          unzip -oq artifact/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip -d compiled
          python - <<'PY'
          from pathlib import Path
          import re
          files=(
            "en/hotels/without-a-car/index.html","hotels/sans-voiture/index.html",
            "en/hotels/villefranche-sur-mer/index.html",
            "en/riviera-guide/saint-paul-de-vence/index.html",
            "riviera-guide/saint-paul-de-vence/index.html",
            "en/good-finds/train-or-bus/index.html",
          )
          for rel in files:
              p=Path("compiled")/rel
              if not p.is_file():print("MISSING",rel,flush=True);continue
              s=p.read_text(encoding="utf-8")
              print("====",rel,"size",len(s),"body",re.search(r"<body[^>]*>",s).group(),flush=True)
              pats=(r"This page answers one question",r"Cette page",r"The next decision",
                    r"La prochaine décision",r"Try Hotel Fit",r"Tester Hotel Fit",
                    r"CHECK RATES ON BOOKING",r"Check rates on Booking",
                    r"class=\"hotel-card",r"class=\"rate-link",r"THE NEXT DECISION",
                    r"class=\"next-links",r"class=\"spot-logistics")
              hits=[]
              for pat in pats:
                  for m in list(re.finditer(pat,s,re.I))[:2]:
                      hits.append((m.start(),pat))
              hits.sort()
              for i,pat in hits[:22]:
                  print("SNIPPET",pat,repr(s[max(0,i-250):i+650]),flush=True)
              print("CSS",re.findall(r'/assets/[^" ]+\.css[^" ]*',s)[:6],flush=True)
          PY