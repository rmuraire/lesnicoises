name: Mametas inspect city markup

on:
  push:
    branches:
      - mametas-v3
    paths:
      - ".github/workflows/mametas-inspect-city-markup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live city decision markup
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import re
          urls=[
            "https://www.mametas.com/en/riviera-guide/nice/?inspect=1",
            "https://www.mametas.com/en/riviera-guide/villefranche-cap-ferrat/?inspect=1",
            "https://www.mametas.com/en/riviera-guide/antibes/?inspect=1",
          ]
          for url in urls:
              req=Request(url,headers={"User-Agent":"MametasMarkupInspect/1.0","Cache-Control":"no-cache","Pragma":"no-cache"})
              with urlopen(req,timeout=30) as r:
                  body=r.read().decode("utf-8","replace")
              idx=body.find("What not to miss")
              print("\n===== "+url+" =====")
              if idx<0:
                  print("NO WHAT NOT TO MISS")
                  continue
              start=max(0,body.rfind("<h2",0,idx)-500)
              print(body[start:idx+9000])
          PY
