name: Mametas inspect city markup

on:
  push:
    branches:
      - mametas-v3
    paths:
      - ".github/workflows/mametas-inspect-city-markup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4

      - name: Inspect rich city generators
        run: |
          set -e
          for src in scripts/v4_layout_refinement_2026_09_30.py.gz.b64 scripts/v4_editorial_density_plan_visual_2026_09_30.py.gz.b64; do
            [ -f "$src" ] || continue
            out="/tmp/$(basename "$src" .gz.b64)"
            base64 -d "$src" | gzip -dc > "$out"
            echo "===== $src ====="
            python - "$out" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding="utf-8",errors="ignore").read()
          for needle in ("What not to miss in Antibes","What not to miss: Villefranche","The edit:","Old Antibes + the ramparts"):
              i=s.find(needle)
              if i>=0:
                  print("\n---",needle,"---")
                  print(s[max(0,i-4500):i+14000])
          PY
          done
