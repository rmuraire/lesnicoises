# Circuit de validation : s'exécute sur chaque proposition de modification.
# Lance les contrôles bloquants, puis indique ce qui serait publié si la
# proposition était fusionnée. N'écrit jamais sur OVH.
name: Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer la proposition
        uses: actions/checkout@v5

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Préparer Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Contrôles bloquants
        run: python outils/controles.py

      - name: Installer l'outil SFTP
        run: python -m pip install --disable-pip-version-check --quiet paramiko==5.0.0

      - name: Ce qui serait publié après fusion (lecture seule)
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python outils/publier_ovh.py plan
