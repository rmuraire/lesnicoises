name: Mametas network diagnostic
on:
  push:
    branches: [mametas-diagnostic]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hash live beach assets
        shell: bash
        run: |
          set -e
          for f in baie-des-fourmis-commons.jpg petite-afrique-commons.jpg fossettes-commons.jpg mala-commons.jpg passable-pexels.jpg; do
            curl -4 -sS -L --max-time 30 "https://www.mametas.com/assets/editorial/beaches/$f" -o "/tmp/$f"
            echo "$f $(wc -c < /tmp/$f) bytes $(sha256sum /tmp/$f | cut -d' ' -f1)"
            file "/tmp/$f"
          done
