name: Mametas network diagnostic
on:
  push:
    branches: [mametas-diagnostic]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check live Riviera Fit CSS
        shell: bash
        run: |
          set -e
          curl -4 -sS -L --max-time 30 "https://www.mametas.com/assets/riviera-chooser.css?v=8&probe=$(date +%s)" -o /tmp/riviera.css
          grep -F "font-size:clamp(18px,1.35vw,21px)!important" /tmp/riviera.css
          echo "RIVIERA FIT TYPE HOTFIX IS LIVE"
