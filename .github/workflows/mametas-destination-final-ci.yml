name: Mametas destination coherence final CI
on:
  push:
    branches: [mametas-coherence-destinations-clean-2026-10-02]
permissions:
  contents: read
jobs:
  destination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/mametas_coherence_config.py scripts/v6_destination_system_2026_10_02.py scripts/validate_v6_destination_system_2026_10_02.py
      - run: python scripts/v6_destination_system_2026_10_02.py
      - run: python scripts/validate_v6_destination_system_2026_10_02.py
