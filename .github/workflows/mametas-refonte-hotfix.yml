name: Mametas Explore refonte focused deploy
# presentation harmonisation retry 2

on:
  push:
    branches:
      - mametas-v3
    paths:
      - ".github/workflows/mametas-refonte-hotfix.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: mametas-explore-refonte-2026-10-01
  cancel-in-progress: true

jobs:
  deploy-refonte:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko

      - name: Download validated production snapshot
        uses: actions/download-artifact@v4
        with:
          name: Mametas_V3_FINAL_USER_DELIVERY_2026-09-27
          path: /tmp/mametas-refonte-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: rmuraire/lesnicoises
          run-id: 36914504302

      - name: Restore validated snapshot
        run: |
          test -s /tmp/mametas-refonte-artifact/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip
          unzip -oq /tmp/mametas-refonte-artifact/Mametas_V3_FINAL_USER_DELIVERY_2026-09-27.zip -d .
          git checkout -- assets/site.js assets/v3.js
          for f in \
            en/explore/french-riviera-honeymoon/index.html \
            en/explore/french-riviera-babymoon/index.html \
            en/explore/french-riviera-proposal/index.html \
            en/explore/living-antibes-expat/index.html \
            en/explore/retire-french-riviera/index.html \
            en/gay-french-riviera/index.html \
            en/solo-female-french-riviera/index.html \
            assets/editorial/refonte-2026/honeymoon.webp \
            assets/editorial/refonte-2026/babymoon.webp \
            assets/editorial/refonte-2026/proposal.webp \
            assets/editorial/refonte-2026/expat-antibes.webp \
            assets/editorial/refonte-2026/retirement.webp \
            assets/hotels/refonte-2026/la-reserve-beaulieu.webp \
            assets/hotels/refonte-2026/mercure-grimaldi.webp \
            assets/hotels/refonte-2026/riva-art-spa.webp
          do
            test -s "$f" || { echo "Snapshot missing: $f"; exit 1; }
          done
          python scripts/validate_booking_affiliation_2026_10_01.py

      - name: Apply global presentation harmonisation
        run: python scripts/v5_global_presentation_harmonisation_2026_10_01.py

      - name: Deploy validated refonte files to OVH
        env:
          MAMETAS_FORCE_FILES: >-
            assets/site.css;assets/v3.css;assets/site.js;assets/v3.js;
            en/explore/index.html;explore/index.html;
            en/explore/french-riviera-honeymoon/index.html;explore/lune-de-miel-cote-d-azur/index.html;
            en/explore/french-riviera-babymoon/index.html;explore/babymoon-cote-d-azur/index.html;
            en/explore/french-riviera-proposal/index.html;explore/demande-en-mariage-cote-d-azur/index.html;
            en/explore/living-antibes-expat/index.html;explore/vivre-antibes-expatrie/index.html;
            en/explore/retire-french-riviera/index.html;explore/retraite-cote-d-azur/index.html;
            en/gay-french-riviera/index.html;cote-dazur-gay/index.html;en/gay-nice/index.html;guide-gay-nice/index.html;
            en/solo-female-french-riviera/index.html;cote-dazur-femme-solo/index.html;
            en/solo-female-french-riviera/eating-going-out-alone/index.html;cote-dazur-femme-solo/manger-sortir-seule/index.html;
            en/solo-female-french-riviera/where-to-stay/index.html;cote-dazur-femme-solo/ou-dormir/index.html;
            en/solo-female-french-riviera/getting-around-without-a-car/index.html;cote-dazur-femme-solo/se-deplacer-sans-voiture/index.html;
            en/solo-female-french-riviera/safety/index.html;cote-dazur-femme-solo/securite/index.html;
            en/solo-female-french-riviera/5-day-itinerary/index.html;cote-dazur-femme-solo/itineraire-5-jours/index.html;
            en/gay-french-riviera/where-to-stay/index.html;cote-dazur-gay/ou-dormir/index.html;
            en/gay-french-riviera/beaches-without-a-car/index.html;cote-dazur-gay/plages-sans-voiture/index.html;
            en/gay-french-riviera/5-day-itinerary/index.html;cote-dazur-gay/itineraire-5-jours/index.html;
            hotels/nice/hotel-windsor/index.html;en/hotels/nice/hotel-windsor/index.html;
            hotels/beaulieu-sur-mer/la-reserve-de-beaulieu/index.html;en/hotels/beaulieu-sur-mer/la-reserve-de-beaulieu/index.html;
            hotels/beaulieu-sur-mer/hotel-carlton/index.html;en/hotels/beaulieu-sur-mer/hotel-carlton/index.html;
            hotels/beaulieu-sur-mer/hotel-select/index.html;en/hotels/beaulieu-sur-mer/hotel-select/index.html;
            hotels/nice/mercure-nice-centre-grimaldi/index.html;en/hotels/nice/mercure-nice-centre-grimaldi/index.html;
            hotels/menton/riva-art-spa/index.html;en/hotels/menton/riva-art-spa/index.html;
            assets/editorial/refonte-2026/honeymoon.webp;assets/editorial/refonte-2026/babymoon.webp;
            assets/editorial/refonte-2026/proposal.webp;assets/editorial/refonte-2026/expat-antibes.webp;
            assets/editorial/refonte-2026/retirement.webp;assets/editorial/refonte-2026/gay-riviera.webp;assets/editorial/nice-riviera.jpg;
            assets/hotels/refonte-2026/hotel-windsor.webp;assets/hotels/refonte-2026/la-reserve-beaulieu.webp;
            assets/hotels/refonte-2026/carlton-beaulieu.webp;assets/hotels/refonte-2026/hotel-select-beaulieu.webp;
            assets/hotels/refonte-2026/mercure-grimaldi.webp;assets/hotels/refonte-2026/riva-art-spa.webp;
            sitemap.xml
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Verify Explore refonte live
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import re, time

          def fetch(url, binary=False):
              last=None
              for _ in range(6):
                  try:
                      req=Request(url,headers={
                          "User-Agent":"MametasRefonteCheck/1.1",
                          "Cache-Control":"no-cache, no-store, must-revalidate",
                          "Pragma":"no-cache",
                      })
                      with urlopen(req,timeout=30) as r:
                          data=r.read()
                          if r.status == 200:
                              return data if binary else data.decode("utf-8","replace")
                          last=f"HTTP {r.status}"
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(4)
              raise SystemExit(f"{url} unavailable: {last}")

          css=fetch("https://www.mametas.com/assets/site.css?v=24.0")
          for token in ("V5 global presentation harmonisation","booking-quiet-cta","intent-faq",".sources ul"):
              if token not in css:
                  raise SystemExit(f"Unified site.css missing {token}")

          gay_img=fetch("https://www.mametas.com/assets/editorial/refonte-2026/gay-riviera.webp",binary=True)
          if len(gay_img)<5000:
              raise SystemExit("Gay Riviera hero asset is not live")

          solo_evening=fetch("https://www.mametas.com/en/solo-female-french-riviera/eating-going-out-alone/")
          if "menton-evening.jpg" in solo_evening or "nice-riviera.jpg" not in solo_evening:
              raise SystemExit("Solo evening hero is not the Nice image")

          honeymoon=fetch("https://www.mametas.com/en/explore/french-riviera-honeymoon/")
          if "Eat &amp; Do" in honeymoon or ">Eat & Do<" in honeymoon or ">Now<" in honeymoon:
              raise SystemExit("Honeymoon still carries legacy header labels")
          if ">Explore<" not in honeymoon or ">Practical<" not in honeymoon:
              raise SystemExit("Honeymoon missing canonical Explore/Practical header")

          gay_page=fetch("https://www.mametas.com/en/gay-french-riviera/")
          if "refonte-2026/gay-riviera.webp" not in gay_page:
              raise SystemExit("Gay Riviera visible hero is missing")

          page_checks={
            "https://www.mametas.com/en/explore/french-riviera-honeymoon/":("refonte-2026/honeymoon.webp","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/explore/french-riviera-babymoon/":("refonte-2026/babymoon.webp","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/explore/french-riviera-proposal/":("refonte-2026/proposal.webp","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/explore/living-antibes-expat/":("refonte-2026/expat-antibes.webp","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/explore/retire-french-riviera/":("refonte-2026/retirement.webp","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/gay-french-riviera/":("Windsor","kqzyfj.com/click-101875476-15734754"),
            "https://www.mametas.com/en/solo-female-french-riviera/":("Booking.com","kqzyfj.com/click-101875476-15734754"),
          }
          for url,needles in page_checks.items():
              body=fetch(url)
              missing=[n for n in needles if n not in body]
              if missing:
                  raise SystemExit(f"{url} missing live refonte markers: {missing}")
              if re.search(r'href=["\']https?://(?:www\.)?booking\.com/',body,re.I):
                  raise SystemExit(f"{url} still contains a raw Booking reservation href")
              print("Refonte page live:",url)

          hotel_urls=(
            "https://www.mametas.com/en/hotels/nice/hotel-windsor/",
            "https://www.mametas.com/en/hotels/beaulieu-sur-mer/la-reserve-de-beaulieu/",
            "https://www.mametas.com/en/hotels/beaulieu-sur-mer/hotel-carlton/",
            "https://www.mametas.com/en/hotels/beaulieu-sur-mer/hotel-select/",
            "https://www.mametas.com/en/hotels/nice/mercure-nice-centre-grimaldi/",
            "https://www.mametas.com/en/hotels/menton/riva-art-spa/",
          )
          for url in hotel_urls:
              body=fetch(url)
              if "kqzyfj.com/click-101875476-15734754" not in body:
                  raise SystemExit(f"{url} missing CJ Booking affiliate exit")
              print("Affiliate hotel page live:",url)

          image_urls=(
            "https://www.mametas.com/assets/editorial/refonte-2026/honeymoon.webp",
            "https://www.mametas.com/assets/editorial/refonte-2026/babymoon.webp",
            "https://www.mametas.com/assets/editorial/refonte-2026/proposal.webp",
            "https://www.mametas.com/assets/editorial/refonte-2026/expat-antibes.webp",
            "https://www.mametas.com/assets/editorial/refonte-2026/retirement.webp",
            "https://www.mametas.com/assets/hotels/refonte-2026/la-reserve-beaulieu.webp",
            "https://www.mametas.com/assets/hotels/refonte-2026/mercure-grimaldi.webp",
            "https://www.mametas.com/assets/hotels/refonte-2026/riva-art-spa.webp",
          )
          for url in image_urls:
              data=fetch(url,binary=True)
              if len(data)<5000:
                  raise SystemExit(f"{url} too small: {len(data)} bytes")
              print("Refonte image live:",url,len(data))

          print("Mametas Explore refonte focused live verification passed")
          PY
