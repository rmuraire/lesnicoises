name: Mametas destination polish live-safe deploy

on:
  push:
    branches:
      - mametas-v3
    paths:
      - ".github/workflows/mametas-destination-polish-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: mametas-destination-polish-live-safe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Mametas
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --disable-pip-version-check --quiet paramiko

      - name: Pull current live destination files
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from scripts.materialize_editorial_html import DESTINATIONS
          import time

          legacy=[
            "en/riviera-guide/cannes/index.html","riviera-guide/cannes/index.html",
            "en/riviera-guide/eze/index.html","riviera-guide/eze/index.html",
            "en/riviera-guide/saint-paul-de-vence/index.html","riviera-guide/saint-paul-de-vence/index.html",
            "en/riviera-guide/saint-tropez/index.html","riviera-guide/saint-tropez/index.html",
          ]
          files={
            "assets/site.css":"https://www.mametas.com/assets/site.css?destpolish=1",
            "assets/v3.css":"https://www.mametas.com/assets/v3.css?destpolish=1",
            "index.html":"https://www.mametas.com/?destpolish=1",
            "fr/index.html":"https://www.mametas.com/fr/?destpolish=1",
            "en/good-finds/index.html":"https://www.mametas.com/en/good-finds/?destpolish=1",
            "bons-plans/index.html":"https://www.mametas.com/bons-plans/?destpolish=1",
          }
          for rel in list(DESTINATIONS)+legacy:
              files[rel]="https://www.mametas.com/"+rel.removesuffix("index.html")+"?destpolish=1"

          for rel,url in files.items():
              last=None
              for _ in range(5):
                  try:
                      req=Request(url,headers={
                          "User-Agent":"MametasDestinationPolish/1.0",
                          "Cache-Control":"no-cache, no-store, must-revalidate",
                          "Pragma":"no-cache",
                      })
                      with urlopen(req,timeout=30) as r:
                          data=r.read()
                          if r.status==200 and len(data)>500:
                              p=Path(rel); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
                              print("Pulled live:",rel,len(data))
                              break
                          last=f"HTTP {r.status}, {len(data)} bytes"
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(2)
              else:
                  raise SystemExit(f"Could not pull {url}: {last}")
          PY

      - name: Apply destination polish
        run: python scripts/apply_mametas_system_v1.py

      - name: Preflight destination polish
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.materialize_editorial_html import DESTINATIONS
          import html

          legacy=[
            "en/riviera-guide/cannes/index.html","riviera-guide/cannes/index.html",
            "en/riviera-guide/eze/index.html","riviera-guide/eze/index.html",
            "en/riviera-guide/saint-paul-de-vence/index.html","riviera-guide/saint-paul-de-vence/index.html",
            "en/riviera-guide/saint-tropez/index.html","riviera-guide/saint-tropez/index.html",
          ]

          for rel,min_size in (("assets/site.css",80000),("assets/v3.css",120000)):
              p=Path(rel); css=p.read_text(encoding="utf-8",errors="ignore")
              if p.stat().st_size<min_size or css.count("{")!=css.count("}"):
                  raise SystemExit(f"{rel} failed size/braces preflight")
              for token in (
                  'editorial shortlist, not cards',
                  '.legacy-place-detail .article',
                  'grid-template-columns:minmax(170px,.72fr)',
              ):
                  if token not in css:
                      raise SystemExit(f"{rel} missing {token}")

          for rel,cfg in DESTINATIONS.items():
              body=Path(rel).read_text(encoding="utf-8",errors="ignore")
              rendered=html.escape(cfg["must_title"])
              if body.count(rendered)!=1:
                  raise SystemExit(f"{rel}: city title count {body.count(rendered)}")
              if 'class="city-must-list"' not in body:
                  raise SystemExit(f"{rel}: canonical shortlist missing")
              if body.count('class="city-must-item"')!=len(cfg["must"]):
                  raise SystemExit(f"{rel}: wrong shortlist item count")
              if "city-must-number" in body:
                  raise SystemExit(f"{rel}: old numbered shortlist remains")
              if "/assets/site.css" in body and "/assets/site.css?v=24.3" not in body:
                  raise SystemExit(f"{rel}: site.css version not bumped")
              if "/assets/v3.css" in body and "/assets/v3.css?v=1.4" not in body:
                  raise SystemExit(f"{rel}: v3.css version not bumped")

          for rel in legacy:
              body=Path(rel).read_text(encoding="utf-8",errors="ignore")
              if "legacy-place-detail" not in body:
                  raise SystemExit(f"{rel}: legacy detail class missing")
              if "/assets/site.css?v=24.3" not in body:
                  raise SystemExit(f"{rel}: site.css cache-bust missing")

          agenda=Path("en/good-finds/index.html").read_text(encoding="utf-8",errors="ignore")
          if "IRONMAN" in agenda:
              raise SystemExit("Agenda still contains IRONMAN")
          if "Ironman" not in agenda:
              raise SystemExit("Agenda missing Ironman")

          print("Destination polish preflight passed")
          PY

      - name: Build focused deployment list
        run: |
          python - <<'PY'
          import os
          from scripts.materialize_editorial_html import DESTINATIONS
          legacy=[
            "en/riviera-guide/cannes/index.html","riviera-guide/cannes/index.html",
            "en/riviera-guide/eze/index.html","riviera-guide/eze/index.html",
            "en/riviera-guide/saint-paul-de-vence/index.html","riviera-guide/saint-paul-de-vence/index.html",
            "en/riviera-guide/saint-tropez/index.html","riviera-guide/saint-tropez/index.html",
          ]
          files=[
            "assets/site.css","assets/v3.css",
            "index.html","fr/index.html",
            "en/good-finds/index.html","bons-plans/index.html",
            *list(DESTINATIONS.keys()),*legacy,
          ]
          files=list(dict.fromkeys(files))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("MAMETAS_FORCE_FILES="+";".join(files)+"\n")
          print("Focused files:",len(files))
          PY

      - name: Deploy destination polish to OVH
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
        run: python scripts/deploy_changed_ftps.py

      - name: Verify destination polish live
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from scripts.materialize_editorial_html import DESTINATIONS
          import html, time

          legacy=[
            "en/riviera-guide/cannes/index.html","riviera-guide/cannes/index.html",
            "en/riviera-guide/eze/index.html","riviera-guide/eze/index.html",
            "en/riviera-guide/saint-paul-de-vence/index.html","riviera-guide/saint-paul-de-vence/index.html",
            "en/riviera-guide/saint-tropez/index.html","riviera-guide/saint-tropez/index.html",
          ]

          def fetch(url):
              last=None
              for _ in range(8):
                  try:
                      req=Request(url,headers={
                          "User-Agent":"MametasDestinationPolishCheck/1.0",
                          "Cache-Control":"no-cache, no-store, must-revalidate",
                          "Pragma":"no-cache",
                      })
                      with urlopen(req,timeout=30) as r:
                          body=r.read().decode("utf-8","replace")
                          if r.status==200:
                              return body
                  except Exception as exc:
                      last=str(exc)
                  time.sleep(3)
              raise SystemExit(f"{url}: {last}")

          for url in (
              "https://www.mametas.com/assets/site.css?destpolishcheck=1",
              "https://www.mametas.com/assets/v3.css?destpolishcheck=1",
          ):
              css=fetch(url)
              for token in ('editorial shortlist, not cards','.legacy-place-detail .article','grid-template-columns:minmax(170px,.72fr)'):
                  if token not in css:
                      raise SystemExit(f"{url}: missing {token}")

          for rel,cfg in DESTINATIONS.items():
              url="https://www.mametas.com/"+rel.removesuffix("index.html")+"?destpolishcheck=1"
              body=fetch(url)
              rendered=html.escape(cfg["must_title"])
              if body.count(rendered)!=1 or body.count('class="city-must-item"')!=len(cfg["must"]):
                  raise SystemExit(f"{url}: canonical shortlist mismatch")
              if "city-must-number" in body:
                  raise SystemExit(f"{url}: numbered shortlist still live")
              if "/assets/site.css" in body and "/assets/site.css?v=24.3" not in body:
                  raise SystemExit(f"{url}: site.css cache-bust missing")
              if "/assets/v3.css" in body and "/assets/v3.css?v=1.4" not in body:
                  raise SystemExit(f"{url}: v3.css cache-bust missing")
              print("Shortlist live:",url)

          for rel in legacy:
              url="https://www.mametas.com/"+rel.removesuffix("index.html")+"?destpolishcheck=1"
              body=fetch(url)
              if "legacy-place-detail" not in body or "/assets/site.css?v=24.3" not in body:
                  raise SystemExit(f"{url}: legacy repair missing")
              print("Legacy detail repaired:",url)

          agenda=fetch("https://www.mametas.com/en/good-finds/?destpolishcheck=1")
          if "IRONMAN" in agenda or "Ironman" not in agenda:
              raise SystemExit("Agenda Ironman casing not live")
          print("Agenda Ironman casing live")

          print("Mametas destination polish is live")
          PY
