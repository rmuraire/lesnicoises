name: Mametas live phase4 diagnostic

on:
  push:
    branches:
      - mametas-coherence-final-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    name: live-check — ${{ matrix.key }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: plan-en
            url: https://www.mametas.com/plan/
            needles: "phase4-plan-depth|plan-riviera-fit-panel|data-riviera-chooser|data-chooser-submit|harmonisation-plan-visual|/plan/real-budget/"
          - key: plan-fr
            url: https://www.mametas.com/fr/planifier/
            needles: "phase4-plan-depth|plan-riviera-fit-panel|data-riviera-chooser|data-chooser-submit|harmonisation-plan-visual|/fr/planifier/budget-reel/"
          - key: budget-en
            url: https://www.mametas.com/plan/real-budget/
            needles: "PASS Sud Azur Explore|€675|€2,020"
          - key: budget-fr
            url: https://www.mametas.com/fr/planifier/budget-reel/
            needles: "PASS Sud Azur Explore|675 €|2 020 €"
          - key: car-en
            url: https://www.mametas.com/plan/car-or-no-car/
            needles: "CAR FOR 1-2 DAYS|Practical"
          - key: car-fr
            url: https://www.mametas.com/fr/planifier/voiture-ou-pas/
            needles: "1-2 JOURS DE VOITURE|Pratique"
          - key: season-en
            url: https://www.mametas.com/plan/when-to-go/
            needles: "APR-JUN|SEP-OCT"
          - key: season-fr
            url: https://www.mametas.com/fr/planifier/quand-partir/
            needles: "AVR-JUIN|SEP-OCT"
          - key: three-en
            url: https://www.mametas.com/plan/three-days-riviera/
            needles: "DAY 1|DAY 3"
          - key: three-fr
            url: https://www.mametas.com/fr/planifier/trois-jours-cote-d-azur/
            needles: "JOUR 1|JOUR 3"
          - key: seven-en
            url: https://www.mametas.com/plan/seven-days-riviera/
            needles: "DAY 7|Choose one direction"
          - key: seven-fr
            url: https://www.mametas.com/fr/planifier/sept-jours-cote-d-azur/
            needles: "JOUR 7|Choisissez une direction"
          - key: short-en
            url: https://www.mametas.com/en/explore/2-3-hours/
            needles: "Only got 2 or 3 hours? Good.|Villefranche-sur-Mer|Èze"
          - key: short-fr
            url: https://www.mametas.com/explore/2-3-heures/
            needles: "Vous n’avez que 2 ou 3 heures ? Très bien.|Villefranche-sur-Mer|Èze"
          - key: weather-en
            url: https://www.mametas.com/en/practical/weather-by-season/
            needles: "SPRING|WINTER|around 15°C in April|/en/good-finds/what-to-book/|/en/good-finds/nice-in-the-rain/"
          - key: weather-fr
            url: https://www.mametas.com/pratique/climat-saisons/
            needles: "mametas-global-header|mametas-global-footer"
          - key: practical-en
            url: https://www.mametas.com/en/practical/
            needles: "practical-harmonised|harmonisation-practical-visual|practical-extra-card|Weather by season|/en/french-riviera-tourism-statistics/|Open the Riviera Agenda"
          - key: explore-en
            url: https://www.mametas.com/en/explore/
            needles: "explore-harmonised|lgbtq-banner--fifth|phase4-short-entry|Explore the Riviera your way.|Women travelling solo|/en/explore/2-3-hours/"
          - key: hotels-en
            url: https://www.mametas.com/en/hotels/
            needles: "Find the right hotel. Start with the right base."
          - key: without-car-en
            url: https://www.mametas.com/en/hotels/without-a-car/
            needles: "harmonisation-without-car-visual|next-decisions-compact"
          - key: train-en
            url: https://www.mametas.com/en/good-finds/train-or-bus/
            needles: "harmonisation-train-visual|next-decisions-compact"
          - key: rain-en
            url: https://www.mametas.com/en/good-finds/nice-in-the-rain/
            needles: "harmonisation-rain-visuals|rain-day-flow|rain-logistics-6"
          - key: beaches-en
            url: https://www.mametas.com/en/beaches/
            needles: "beach-harmonised|beach-decision-grid|antibes-gravette-deposit.jpg|baie-des-fourmis-final.jpg|mala-commons.jpg|petite-afrique-final.jpg|nice-beach-umbrellas.webp"
    steps:
      - name: Check live markers
        env:
          URL: ${{ matrix.url }}
          NEEDLES: ${{ matrix.needles }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url=os.environ["URL"]+"?diag=20261002"
          needles=os.environ["NEEDLES"].split("|")
          req=Request(url,headers={"User-Agent":"MametasLiveDiagnostic/1.0","Cache-Control":"no-cache, no-store","Pragma":"no-cache"})
          with urlopen(req,timeout=30) as response:
              body=response.read().decode("utf-8","replace")
              missing=[n for n in needles if n not in body]
              if response.status != 200 or missing:
                  raise SystemExit(f"{url} failed: status={response.status} missing={missing}")
              print(f"PASS {url}")
          PY
