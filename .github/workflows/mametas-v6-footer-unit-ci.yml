name: Mametas V6 footer unit CI
on:
  push:
    branches: [fix/v6-footer-collapse-2026-10-02]
permissions:
  contents: read
jobs:
  shell-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/v6_coherence_envelope_2026_10_02.py
      - name: Unit test
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("scripts/v6_coherence_envelope_2026_10_02.py")
          spec=importlib.util.spec_from_file_location("v6",p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          src='''<html><body><div class="destination-practical">KEEP</div><header>OLD</header><main>BODY</main><footer class="one">OLD1</footer><footer class="two">OLD2</footer></body></html>'''
          out,ok=m.replace_shell(src,'<header class="mametas-global-header">NEW</header>','<footer class="mametas-global-footer">NEW</footer>')
          assert ok and "KEEP" in out and "BODY" in out
          assert "OLD1" not in out and "OLD2" not in out
          assert out.count("<footer") == 1
          assert out.count("mametas-global-footer") == 1
          print("footer collapse unit test passed")
          PY
