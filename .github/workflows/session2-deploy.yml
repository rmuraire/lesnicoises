name: Mametas session 2 deploy
on:
  push:
    branches: [mametas-v3]
    paths: ['.github/workflows/session2-deploy.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mametas-v3
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet paramiko
      - run: python scripts/validate_mametas.py
      - name: Deploy session 2 pages
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_ROOT: ${{ secrets.OVH_FTP_ROOT }}
          MAMETAS_FORCE_FILES: index.html;fr/index.html;plan/five-days-nice-no-car/index.html;fr/planifier/cinq-jours-nice-sans-voiture/index.html
        run: python scripts/deploy_changed_ftps.py
      - name: Verify public pages
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          checks={
            'https://www.mametas.com/':'We’ll tell you where to stay',
            'https://www.mametas.com/fr/':'On vous dira où dormir',
            'https://www.mametas.com/plan/five-days-nice-no-car/':'Train, bus, taxi or car?',
            'https://www.mametas.com/fr/planifier/cinq-jours-nice-sans-voiture/':'Train, bus, taxi ou voiture ?'
          }
          for url,needle in checks.items():
            req=Request(url,headers={'User-Agent':'MametasDeployCheck/1.0'})
            body=urlopen(req,timeout=30).read().decode('utf-8')
            if needle not in body: raise SystemExit(f'Missing expected live content at {url}')
            print('Verified',url)
          PY
