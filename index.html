<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Niçoises | Riviera Insiders</title>
<meta name="description" content="Les Niçoises sélectionne les plages, restaurants, hôtels, escapades et lieux culturels à découvrir sur la Côte d’Azur, de Nice à Saint-Tropez.">
<link rel="canonical" href="https://lesnicoises.com/">
<link rel="alternate" hreflang="fr" href="https://lesnicoises.com/">
<link rel="alternate" hreflang="en" href="https://lesnicoises.com/en/">
<meta property="og:title" content="Les Niçoises | Riviera Insiders">
<meta property="og:description" content="Les Niçoises sélectionne les plages, restaurants, hôtels, escapades et lieux culturels à découvrir sur la Côte d’Azur, de Nice à Saint-Tropez.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lesnicoises.com/">
<style>
:root{--cream:#f4ecdf;--navy:#12213d;--ink:#3e485d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.visually-hidden{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important
}
.hero{position:relative;width:100%;overflow:hidden;background:#79cbe8}
.hero img{display:block;width:100%;height:auto}
.menu-hotspots{
  position:absolute;left:0;right:0;bottom:0;height:8.9%;
  display:grid;grid-template-columns:repeat(6,1fr);z-index:5
}
.menu-hotspots a{display:block}
.menu-hotspots a:focus-visible{outline:3px solid #132341;outline-offset:-4px}
.lang-hotspots{position:absolute;right:2.4%;top:4.5%;width:6.9%;height:4.2%;z-index:6;display:grid;grid-template-columns:1fr 1fr}
.lang-hotspots a{display:block}
.lang-hotspots a:focus-visible{outline:2px solid #132341;outline-offset:-2px}
.intro{max-width:1000px;margin:0 auto;padding:62px 28px 76px;text-align:center}
.intro p{margin:0 auto 28px;max-width:780px;font-family:Georgia,serif;font-size:22px;line-height:1.55;color:var(--ink)}
.intro-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.intro-links a{border:1px solid var(--navy);padding:12px 18px;font-size:11px;letter-spacing:.11em;font-weight:800;text-transform:uppercase}
.intro-links a:hover{background:var(--navy);color:var(--cream)}
.mobile-nav{display:none}
@media(max-width:760px){
  .intro{padding:42px 22px 58px}
  .intro p{font-size:19px}
  .menu-hotspots{height:9.8%}
}
</style>
</head>
<body>
<main>
  <h1 class="visually-hidden">Les Niçoises</h1>
  <p class="visually-hidden">They know the Riviera.</p>

  <section class="hero" aria-label="Les Niçoises, Riviera Insiders">
    <img src="/assets/hero-les-nicoises-final.png"
         width="1672" height="941"
         alt="Cinq Niçoises âgées, très bronzées, assises de face sur les chaises bleues de Nice devant la Méditerranée">
    <nav class="menu-hotspots" aria-label="Rubriques principales">
      <a href="/restaurants/" aria-label="Restaurants"><span class="visually-hidden">Restaurants</span></a><a href="/plages/" aria-label="Plages"><span class="visually-hidden">Plages</span></a><a href="/bons-plans/" aria-label="Bons plans"><span class="visually-hidden">Bons plans</span></a><a href="/culture/" aria-label="Art & Culture"><span class="visually-hidden">Art & Culture</span></a><a href="/hotels/" aria-label="Hôtels"><span class="visually-hidden">Hôtels</span></a><a href="/escapades/" aria-label="Escapades"><span class="visually-hidden">Escapades</span></a>
    </nav>
    <div class="lang-hotspots" aria-label="Langues">
      <a class="lang-fr" href="/" aria-label="Français"></a><a class="lang-en" href="/en/" aria-label="English"></a>
    </div>
  </section>

  <section class="intro">
    <p>Les Niçoises sélectionne les plages, restaurants, hôtels, escapades et lieux culturels de la Riviera. Pas tout. On a aussi une vie.</p>
    <div class="intro-links">
      <a href="/riviera-guide/">Riviera Guide</a>
      <a href="/a-propos/">Qui sont ces dames ?</a>
    </div>
  </section>
</main>
</body>
</html>
