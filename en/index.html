<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Les Niçoises | French Riviera Guide</title>
<meta content="Les Niçoises selects beaches, restaurants, hotels, culture and day trips across the French Riviera, from Nice to Saint-Tropez." name="description"/>
<link href="https://lesnicoises.com/en/" rel="canonical"/>
<link href="https://lesnicoises.com/" hreflang="fr" rel="alternate"/>
<link href="https://lesnicoises.com/en/" hreflang="en" rel="alternate"/>
<meta content="Les Niçoises | French Riviera Guide" property="og:title"/>
<meta content="Les Niçoises selects beaches, restaurants, hotels, culture and day trips across the French Riviera, from Nice to Saint-Tropez." property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="https://lesnicoises.com/en/" property="og:url"/>
<style>
:root{--cream:#f4ecdf;--navy:#12213d;--ink:#3e485d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.visually-hidden{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important
}
.hero{position:relative;width:100%;overflow:hidden;background:#79cbe8}
.hero img{display:block;width:100%;height:auto}
.menu-hotspots{
  position:absolute;left:0;right:0;bottom:0;height:8.9%;
  display:grid;grid-template-columns:repeat(6,1fr);z-index:5
}
.menu-hotspots a{display:block}
.menu-hotspots a:focus-visible{outline:3px solid #132341;outline-offset:-4px}
.lang-hotspots{position:absolute;right:2.4%;top:4.5%;width:6.9%;height:4.2%;z-index:6;display:grid;grid-template-columns:1fr 1fr}
.lang-hotspots a{display:block}
.lang-hotspots a:focus-visible{outline:2px solid #132341;outline-offset:-2px}
.intro{max-width:1000px;margin:0 auto;padding:62px 28px 76px;text-align:center}
.intro p{margin:0 auto 28px;max-width:780px;font-family:Georgia,serif;font-size:22px;line-height:1.55;color:var(--ink)}
.intro-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.intro-links a{border:1px solid var(--navy);padding:12px 18px;font-size:11px;letter-spacing:.11em;font-weight:800;text-transform:uppercase}
.intro-links a:hover{background:var(--navy);color:var(--cream)}
.mobile-nav{display:none}
@media(max-width:760px){
  .intro{padding:42px 22px 58px}
  .intro p{font-size:19px}
  .menu-hotspots{height:9.8%}
}
</style>
</head>
<body>
<main>
<h1 class="visually-hidden">Les Niçoises</h1>
<p class="visually-hidden">We know the Riviera. You’re new, pichoun.</p>
<section aria-label="Les Niçoises, Riviera Insiders" class="hero">
<img alt="Five elderly Niçoise women, deeply tanned, sitting on Nice blue chairs overlooking the Mediterranean" height="941" src="/assets/hero-les-nicoises-final.png" width="1670"/>
<nav aria-label="Rubriques principales" class="menu-hotspots">
<a aria-label="Restaurants" href="/en/restaurants/"><span class="visually-hidden">Restaurants</span></a><a aria-label="Beaches" href="/en/beaches/"><span class="visually-hidden">Beaches</span></a><a aria-label="Good finds" href="/en/good-finds/"><span class="visually-hidden">Good finds</span></a><a aria-label="Art &amp; Culture" href="/en/culture/"><span class="visually-hidden">Art &amp; Culture</span></a><a aria-label="Hotels" href="/en/hotels/"><span class="visually-hidden">Hotels</span></a><a aria-label="Day trips" href="/en/day-trips/"><span class="visually-hidden">Day trips</span></a>
</nav>
<div aria-label="Langues" class="lang-hotspots">
<a aria-label="Français" class="lang-fr" href="/"></a><a aria-label="English" class="lang-en" href="/en/"></a>
</div>
</section>
<section class="intro">
<p>Les Niçoises selects beaches, restaurants, hotels, culture and day trips across the Riviera. Not everything. We have lives too.</p>
<div class="intro-links">
<a href="/en/riviera-guide/">Riviera Guide</a>
<a href="/en/about/">Who are these ladies?</a>
</div>
</section>
</main>
</body>
</html>
